services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llmbench
      POSTGRES_USER: llmbench
      POSTGRES_PASSWORD: llmbench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmbench -d llmbench"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: llmbench_backend.settings.prod
      DATABASE_URL: postgres://llmbench:llmbench@postgres:5432/llmbench
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: llmbench_backend.settings.prod
      DATABASE_URL: postgres://llmbench:llmbench@postgres:5432/llmbench
      REDIS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
