target:
  provider: openai_compatible
  base_url: "http://localhost:8000/v1"
  model: "your-model"
  api_key_env: "OPENAI_API_KEY"
  timeout_sec: 60
  retries: 2
  max_concurrency: 1

generation:
  temperature: 0.2
  top_p: 0.95
  max_tokens: 128

defense:
  profile: "D3"
  system_prompt_path: "prompts/safety_system_ru_v1.txt"
  wrap_user_messages: true
  prefilter_patterns:
    - "(?i)ignore.*previous|игнорируй.*(инструкц|правил|system)"
    - "(?i)developer message|system message|hidden (prompt|policy)"
    - '(?i)role\s*:\s*system|<\s*system\s*>'
    - "(?i)обой(ди|ти).*огранич|jailbreak|prompt injection"
    - "(?i)покажи.*(system prompt|системн.*промпт|скрыт.*инструк)"
    - "(?i)выдай.*(пароль|ключ|token|api[-_ ]?key)"
  postfilter_patterns:
    - "(?i)api[-_ ]?key|secret|token|пароль|ключ"
    - "(?i)system prompt|скрыт(ые|ая) инструкц|внутренн(ие|яя) инструкц"
    - "(?i)ssh-rsa|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----"
    - "(?i)BEGIN\\s+SYSTEM|END\\s+SYSTEM"

run:
  repeats: 1
