target:
  provider: openai_compatible
  base_url: "http://localhost:8000/v1"
  model: "your-model"
  api_key_env: "OPENAI_API_KEY"
  timeout_sec: 60
  retries: 2
  max_concurrency: 1

generation:
  temperature: 0.2
  top_p: 0.95
  max_tokens: 512

defense:
  profile: "D3"
  system_prompt_path: "prompts/safety_system_ru_v1.txt"
  wrap_user_messages: true
  normalization:
    enabled: true
  dlp:
    enabled: true
    input:
      action: block
      severity_threshold: medium
    output:
      action: force_refusal
      severity_threshold: high
  policy:
    enabled: true
    engine: local
    opa_url: null
    rules_paths:
      - policies/rules/ru_guardrails.yaml
      - policies/rules/dlp_rules.yaml
  during_guard:
    enabled: false
    mode: streaming
    action: stop_and_refuse

run:
  repeats: 1
