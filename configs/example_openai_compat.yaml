target:
  provider: openai_compatible
  base_url: "http://localhost:8000/v1"
  model: "your-model-name"
  api_key_env: "OPENAI_API_KEY"
  timeout_sec: 60
  retries: 2
  max_concurrency: 1

generation:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 256

defense:
  json_schema_path: null

run:
  repeats: 1
