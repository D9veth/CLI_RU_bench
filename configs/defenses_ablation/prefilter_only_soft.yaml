target:
  provider: openai_compatible
  base_url: "http://localhost:8000/v1"
  model: "your-model"
  api_key_env: "OPENAI_API_KEY"
  timeout_sec: 60
  retries: 2
  max_concurrency: 1

generation:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 512

defense:
  profile: "D2"
  prefilter_patterns:
    - "(?i)jailbreak"
    - "(?i)игнорируй.*инструк"

run:
  repeats: 1
