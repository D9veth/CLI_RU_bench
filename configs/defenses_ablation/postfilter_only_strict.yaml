target:
  provider: openai_compatible
  base_url: "http://localhost:8000/v1"
  model: "your-model"
  api_key_env: "OPENAI_API_KEY"
  timeout_sec: 60
  retries: 2
  max_concurrency: 1

generation:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 512

defense:
  profile: "D3"
  postfilter_patterns:
    - "(?i)api[-_ ]?key|secret|token|пароль|ключ"
    - "(?i)system prompt|скрыт(ые|ая) инструкц|внутренн(ие|яя) инструкц"
    - "(?i)ssh-rsa|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----"
    - "(?i)BEGIN\\s+SYSTEM|END\\s+SYSTEM"

run:
  repeats: 1
